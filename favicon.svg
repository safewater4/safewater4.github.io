<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="drop-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#56d2ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Thân giọt nước SafeBuddy -->
  <path d="M64 6 C42 40 18 64 18 90 A46 46 0 0 0 110 90 C110 64 86 40 64 6 Z" 
        fill="url(#drop-grad)" 
        stroke="#0369a1" 
        stroke-width="3.5"
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Vệt sáng phản quang trên đầu -->
  <ellipse cx="42" cy="62" rx="7" ry="14" fill="#ffffff" opacity="0.75" transform="rotate(22 42 62)"/>

  <!-- Mắt trái -->
  <circle cx="48" cy="82" r="11" fill="#ffffff"/>
  <circle cx="50" cy="83" r="6" fill="#0f172a"/>
  <circle cx="48" cy="80" r="2.5" fill="#ffffff"/>

  <!-- Mắt phải -->
  <circle cx="80" cy="82" r="11" fill="#ffffff"/>
  <circle cx="82" cy="83" r="6" fill="#0f172a"/>
  <circle cx="80" cy="80" r="2.5" fill="#ffffff"/>

  <!-- Má hồng hai bên -->
  <circle cx="33" cy="94" r="6.5" fill="#ff7694" opacity="0.85"/>
  <circle cx="95" cy="94" r="6.5" fill="#ff7694" opacity="0.85"/>

  <!-- Nụ cười tươi -->
  <path d="M53 96 Q64 106 75 96" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Phao cứu sinh mini an toàn -->
  <g transform="translate(64, 115)">
    <!-- Vòng phao ngoài màu đỏ -->
    <circle r="12" fill="#ffffff" stroke="#ef4444" stroke-width="6"/>
    <!-- Các vạch trắng phản quang trên phao -->
    <path d="M-8 -8 L4 4 M8 -8 L-4 4" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
