<!DOCTYPE html>
<html lang="vi" data-root="../" data-nav="kienthuc" translate="no" class="notranslate">
<head>
<meta name="google" content="notranslate">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video – SafeWater</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
main{max-width:1380px;padding:24px clamp(16px,4vw,48px) 56px}
.video-detail-back{display:inline-flex;margin:0 0 16px}
#video-title{margin:0 0 24px;font-size:clamp(34px,5vw,54px);line-height:1.15}
#video.split{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:28px;align-items:start}
#video .video-card{overflow:hidden;margin:0!important;border:1px solid var(--bd);border-radius:24px;background:var(--card);box-shadow:0 12px 32px #0a4a8a1c}
#video .video-wrapper{position:relative;width:100%;padding-top:56.25%;background:#091726}
#video .video-wrapper iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#video .video-info{padding:18px}
#video .video-hazard{padding:14px 16px;border-left:4px solid var(--ac);border-radius:0 14px 14px 0;background:#fff7e8;color:var(--tx);line-height:1.65}
#vq2 .card{padding:clamp(20px,3vw,32px);border:1px solid var(--bd);border-radius:24px;background:var(--card);box-shadow:0 12px 32px #0a4a8a1c}
#vq2 .mu{margin-bottom:10px;font-weight:700;color:var(--pr)}
#vq2 h3{margin:0 0 16px;font-size:clamp(21px,2.4vw,29px);line-height:1.35}
#vq2 .opt{margin:10px 0;padding:13px 16px;border-radius:16px;line-height:1.5}
#vq2 #qf{min-height:1.5em;margin-bottom:0;font-weight:800}
@media(max-width:760px){main{padding-top:18px}#video.split{grid-template-columns:1fr;gap:18px}#video-title{margin-bottom:18px}}
</style>
</head>
<body>
<!-- Header, menu, nút SOS và footer do assets/js/core/layout.js dựng tự động -->
<main>
<a class="b o video-detail-back" href="index.html">← Kiến thức</a>
<h1 id="video-title"></h1>
<div class="split" id="video"></div>
</main>
<script src="../assets/js/core/dom.js"></script>
<script src="../assets/js/icons/sprite-line.js"></script>
<script src="../assets/js/icons/sprite-3d.js"></script>
<script src="../assets/js/core/icons.js"></script>
<script src="../assets/js/core/layout.js"></script>
<script src="../assets/js/core/quiz.js"></script>
<script src="../assets/js/data/media.js"></script>
<script src="../assets/js/pages/videos.js"></script>
</body>
</html>
