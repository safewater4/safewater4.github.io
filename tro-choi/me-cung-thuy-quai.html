function ico(c,id,px,py,s){c.save();c.translate(px,py);c.scale(s/12,s/12);const Q=(col,a,b,w,h)=>{c.fillStyle=col;c.fillRect(a,b,w,h)};

else if(id==4){Q('#3aa0ff',2,3,8,9);Q('#aee3ff',3,4,2,6);Q('#e63946',4,0,4,3);Q('#1a6fc0',2,3,8,1)}
else if(id==5){c.strokeStyle='#d2b48c';c.lineWidth=2;c.beginPath();c.arc(6,6,4.5,0,6.3);c.stroke();c.beginPath();c.arc(6,6,2,0,6.3);c.stroke();Q('#d2b48c',9,9,3,2)}
else if(id==6){Q('#222',3,0,6,12);Q('#6fd3ff',4,1,4,8);Q('#aaa',5,10,2,1)}

else if(id=='fist'){Q('#e63946',0,4,2,6);Q('#ffd0a0',2,3,8,7);Q('#c98a5a',4,3,1,3);Q('#c98a5a',6,3,1,3);Q('#c98a5a',8,3,1,3);Q('#ffd0a0',9,2,3,3);Q('#c98a5a',2,9,8,1)}

else if(i==2){Q('#ffd23f',2,7,10,7);Q('#ffd23f',9,2,5,6);Q('#ff8c1a',14,5,2,2);Q('#000',12,3,1,1);Q('#e0b020',4,9,5,3)}
else if(i==3){Q('#fff',2,7,10,5);Q('#cfd8dc',3,4,7,3);Q('#fff',11,4,4,4);Q('#ffd23f',15,6,1,2);Q('#000',13,5,1,1);Q('#b0bec5',0,8,3,2)}
else if(i==5){Q('#0e8fb0',0,10,3,3);Q('#19c6e0',2,8,9,4);Q('#19c6e0',4,5,4,4);Q('#19c6e0',9,3,5,5);Q('#ffd23f',10,1,1,3);Q('#ffd23f',13,1,1,3);Q('#fff',12,4,1,1);Q('#bff6ff',3,11,8,1);Q('#ffd23f',4,4,1,2);Q('#ffd23f',6,4,1,2);Q('#ff7a59',14,6,2,1)}
else if(i==6){Q('#f5e9ff',3,6,9,6);Q('#f5e9ff',10,2,5,5);Q('#ffd23f',13,0,1,3);Q('#000',13,4,1,1);Q('#ff7ad9',8,2,2,6);Q('#7ad9ff',0,9,4,5);Q('#f5e9ff',4,12,2,3);Q('#f5e9ff',9,12,2,3);Q('#ff7ad9',1,10,2,2)}
else if(i==7){Q('#6fd3ff',0,3,5,4);Q('#6fd3ff',1,7,4,3);Q('#bfe9ff',5,6,6,6);Q('#bfe9ff',10,3,4,4);Q('#ffd23f',14,5,2,1);Q('#000',12,4,1,1);Q('#ff6b6b',11,1,1,2);Q('#ff6b6b',12,0,1,2);Q('#e0f7ff',1,12,9,2);Q('#fff',0,13,4,2)}

if(i>=5){const k=Math.floor(frame/8)%3;[[0,1],[13,3],[7,0],[2,13]].forEach((p,j)=>{if((j+k)%3<2)Q(i==7?'#e0f7ff':'#fff',p[0],p[1],2,2)})}

function gen(n){
let s=n*7919+13;const rn=()=>{s=(Math.imul(s,1103515245)+12345)&0x7fffffff;return s/2147483647};
const boss=n%10==0;cols=110+n*2;M=[];for(let r=0;r<R;r++)M.push(new Uint8Array(cols));
for(let c=0;c<cols;c++){M[10][c]=1;M[11][c]=1}
pits=[];whirl=[];coins=[];boxL=0;let c=9;const g=cols-16,gw=boss?8:6,lim=g-9,want=8+Math.floor(n/6);
while(c<lim){const k=rn();
if(k<.28+n*.005){const w=2+(rn()<.3+n*.01?1:0);for(let i=0;i<w;i++){M[10][c+i]=M[11][c+i]=0;coins.push({x:(c+i)*T+8,y:8*T})}pits.push({c,w});c+=w+3}
else if(k<.45+n*.003){whirl.push(c*T+1);c+=4}
else if(k<.8){const len=3+(rn()*3|0);for(let i=0;i<len;i++){const b=rn()<.4&&boxL<want;M[7][c+i]=b?2:1;if(b)boxL++;else coins.push({x:(c+i)*T+8,y:6*T+8})}c+=len+2}
else{for(let i=0;i<4;i++)coins.push({x:(c+i)*T+8,y:9*T+8});c+=5}}
for(let a=0;boxL<want&&a<300;a++){const cc=10+(rn()*(lim-12)|0);if(!M[7][cc]&&M[10][cc]){M[7][cc]=2;boxL++}}
for(let cc=g;cc<g+gw;cc++)for(let r=0;r<10;r++)M[r][cc]=4;
mon={gx:g*T,gw:gw*T,hp:3+Math.floor(n/8)+(boss?2:0),cd:90,stun:0,fl:0,dead:false,boss};mon.max=mon.hp;flagX=(cols-4)*T;mkTr(n)}

if(st>=3){let c=pc(c=>ok(c,2,2));if(c<0)c=pc(c=>M[10][c]&&M[10][c+1]&&M[10][c+2]);if(c>0)tr.ff.push({x:c*T,h:0});mon.sl=1}

else if(!mon.dead&&P.x>mon.gx-200&&toastT<80)toast('Chưa tới!','Phải đứng sát màn thác nước mới đấm trúng.')}

else if(P.vy<0){const r=Math.floor(P.y/T);for(let c=c1;c<=c2;c++)if(sol(c,r)){P.y=(r+1)*T;P.vy=0;if(M[r][c]==2)bump(c,r);break}}
