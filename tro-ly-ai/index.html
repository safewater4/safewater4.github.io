<!-- Header, menu, nút SOS và footer do assets/js/core/layout.js dựng tự động -->
<main>
<h1><svg class="i3 hi"><use href="#c-bot"/></svg> Trợ lý SafeWater</h1><div class="split"><div class="card"><div class="mas" id="mas">😊</div><p style="text-align:center" class="mu">Giọt nước SafeBuddy <span id="ai-status-badge" style="display:inline-block;margin-left:4px;padding:2px 8px;border-radius:12px;font-size:12px;background:#dcfce7;color:#15803d;font-weight:700">● Trực tuyến (Gemini AI)</span></p><div id="qk"></div></div>
<div class="card"><div class="chat" id="chat"><div class="m a"><span>Chào em! Hỏi mình về phòng chống đuối nước nhé.</span><button type="button" class="msg-speak-btn" title="Bấm để nghe đọc" onclick="if(window.SW&&window.SW.speakVietnamese)window.SW.speakVietnamese(this.previousElementSibling.textContent)">🔊</button></div></div><div style="display:flex;gap:6px;margin-top:6px"><input id="cin" style="flex:1" placeholder="Nhập câu hỏi…"><button class="b" id="mic" title="Nói qua micro">🎤</button><button class="b" id="snd">Gửi</button></div><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:6px"><label class="mu" style="cursor:pointer;display:flex;align-items:center;gap:4px"><input type="checkbox" id="tts" checked> 🔊 Tự động đọc</label><div style="display:flex;align-items:center;gap:5px"><button type="button" id="page-mute" style="border:none;background:transparent;cursor:pointer;font-size:14px;padding:0" title="Bật/Tắt âm">🔊</button><input type="range" id="page-vol" min="0" max="1" step="0.05" value="1" style="width:75px;accent-color:var(--pr);cursor:pointer;height:4px" title="Âm lượng"><span id="page-vol-val" style="font-size:12px;min-width:30px;color:var(--mu)">100%</span></div></div></div></div>
</main>
